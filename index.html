<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiKonKep — Dinas Kominfo Aceh Tengah</title>
<style>
  :root { --biru:#0f2438; --biru2:#1c3a57; --hijau:#1c7c3c; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#0f2438 0%,#1c3a57 60%,#2a4e73 100%);
    font-family:"Segoe UI",Arial,sans-serif; color:#111;
  }
  .kartu {
    width:520px; max-width:94vw; background:#fff; border-radius:14px; padding:30px 28px;
    box-shadow:0 14px 40px rgba(0,0,0,.35); text-align:center;
  }
  .kartu h1 { margin:0 0 4px; font-size:22px; color:var(--biru); }
  .kartu .sub { margin:0 0 18px; font-size:12.5px; color:#567; line-height:1.5 }
  .badge-online { display:inline-block; background:#e7f3ec; color:#1c7c3c; border:1px solid #b6dfc2; padding:4px 10px; border-radius:999px; font-size:11px; font-weight:700; margin-bottom:14px }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0 10px }
  .btn {
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:13px 16px; border-radius:10px; font-size:14px; font-weight:700;
    color:#fff !important; text-decoration:none; border:none; cursor:pointer;
  }
  .btn.utama { background:var(--hijau); grid-column:1 / -1; font-size:15px; padding:15px }
  .btn.utama:hover { background:#229049; }
  .btn.biru { background:var(--biru2); }
  .btn.biru:hover { background:#244a6e; }
</style>
</head>
<body>
  <div class="kartu">
    <div class="badge-online">● ONLINE — Vercel + Neon aktif</div>
    <h1>SiKonKep</h1>
    <p class="sub">Formulir Daftar Kepentingan Pribadi<br>Dinas Komunikasi dan Informatika Kab. Aceh Tengah</p>

    <div class="grid">
      <a class="btn utama" href="formulir-daftar-kepentingan-pribadi.html">📝 Isi Formulir Online</a>
      <a class="btn biru" href="login.html">🔐 Login Admin</a>
      <a class="btn biru" href="admin.html">📊 Dashboard Admin</a>
    </div>
  </div>
</body>
</html>
